<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta Gadgets (demo shop)</title>
<style>
  :root { --navy: #14213D; --amber: #FFC42E; --paper: #F4F4F2; --line: #E2E4E8; --grey: #5C6370; --red: #C8463D; --green: #2E7D4F; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--navy); }
  header { background: var(--navy); color: #fff; padding: 20px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: #C9CFDA; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--grey); font-size: 13px; }
  #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .product { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .thumb { height: 96px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 26px; color: #fff; }
  .category { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: .06em; }
  .name { font-weight: 600; text-decoration: none; color: inherit; }
  .price { font-size: 20px; font-weight: 700; }
  .was { color: var(--grey); text-decoration: line-through; font-size: 13px; margin-left: 6px; font-weight: 400; }
  .sale { align-self: flex-start; background: var(--amber); color: var(--navy); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .stock { font-size: 13px; color: var(--green); }
  .stock.out { color: var(--red); }
  #more { display: block; margin: 24px auto 0; padding: 10px 22px; border: 0; border-radius: 99px; background: var(--navy); color: #fff; font-size: 14px; cursor: pointer; }
  #more[hidden] { display: none; }
  #loading { color: var(--grey); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Delta Gadgets</h1>
  <p>A demo shop for the price tracker. Prices and stock change every day, and the products are drawn by
     JavaScript after the page loads, so a plain HTTP request sees an empty page.</p>
</header>
<main>
  <div class="bar"><span id="count"></span><span id="day"></span></div>
  <div id="loading">Loading products...</div>
  <div id="products"></div>
  <button id="more" hidden>Load more</button>
</main>
<script>
const PAGE_SIZE = 8;
const COLOURS = { Audio: "#5B8DEF", Wearables: "#7CC68D", Charging: "#E0A050" };
const day = new URLSearchParams(location.search).get("date") || new Date().toISOString().slice(0, 10);

// The same text always gives the same number in [0, 1), so a day's prices are stable.
function chance(text) {
  let h = 2166136261;
  for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Like a real shop, each product's price only changes on some days (about 1 in 8).
function lastChange(p) {
  const d = new Date(day + "T00:00:00Z");
  for (let i = 0; i < 90; i++) {
    const s = d.toISOString().slice(0, 10);
    if (chance(`${s}|change|${p.id}`) < 0.12) return s;
    d.setUTCDate(d.getUTCDate() - 1);
  }
  return "launch";
}

function priceToday(p) {
  const since = lastChange(p);
  const price = Math.round(p.base * (0.82 + 0.26 * chance(`${since}|${p.id}`)) / 5) * 5;
  return { price, sale: price <= p.base * 0.9, inStock: chance(`${since}|stock|${p.id}`) > 0.1 };
}

function card(p) {
  const t = priceToday(p);
  const el = document.createElement("article");
  el.className = "product";
  el.dataset.id = p.id;
  el.innerHTML = `
    <div class="thumb" style="background:${COLOURS[p.category]}">${p.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase()}</div>
    <span class="category">${p.category}</span>
    <a class="name" href="#/product/${p.id}">${p.name}</a>
    ${t.sale ? '<span class="sale">Sale</span>' : ""}
    <span class="price">EGP ${t.price.toLocaleString("en-US")}${t.sale ? `<span class="was">EGP ${p.base.toLocaleString("en-US")}</span>` : ""}</span>
    <span class="stock ${t.inStock ? "" : "out"}">${t.inStock ? "In stock" : "Out of stock"}</span>`;
  return el;
}

const wait = ms => new Promise(r => setTimeout(r, ms));
let all = [], shown = 0;

async function showMore() {
  document.getElementById("more").disabled = true;
  await wait(500);  // like a real shop calling its API
  const grid = document.getElementById("products");
  all.slice(shown, shown + PAGE_SIZE).forEach(p => grid.appendChild(card(p)));
  shown = Math.min(shown + PAGE_SIZE, all.length);
  document.getElementById("count").textContent = `Showing ${shown} of ${all.length} products`;
  const more = document.getElementById("more");
  more.hidden = shown >= all.length;
  more.disabled = false;
}

(async () => {
  document.getElementById("day").textContent = `Prices for ${day}`;
  await wait(700);
  all = await (await fetch("products.json")).json();
  document.getElementById("loading").remove();
  document.getElementById("more").addEventListener("click", showMore);
  await showMore();
})();
</script>
</body>
</html>
